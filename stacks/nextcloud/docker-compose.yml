version: "3.8"

networks:
  nextcloud_net:
    driver: bridge

services:
  # ---------- MariaDB for Nextcloud ----------
  db:
    image: mariadb:10.11
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - ./db:/var/lib/mysql
    networks: [nextcloud_net]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Redis for Nextcloud locking/caching ----------
  redis:
    image: redis:alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./redis:/data
    networks: [nextcloud_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- Nextcloud (Apache) ----------
  app:
    image: nextcloud:apache
    container_name: nextcloud-app
    restart: unless-stopped
    depends_on:
      - db
      - redis
    ports:
      - "8086:80"   # change/remove if you use a reverse proxy
    environment:
      - MYSQL_HOST=db
      - MYSQL_DATABASE=nextcloud
      - MYSQL_USER=nextcloud
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_HOST_PASSWORD=${REDIS_PASSWORD}
      # If using a reverse proxy (e.g., NPM), you can set these later:
      # - OVERWRITEPROTOCOL=https
      # - OVERWRITEHOST=cloud.example.com
      # - TRUSTED_PROXIES=172.18.0.0/16
    volumes:
      - ./nextcloud:/var/www/html
      - ./apps:/var/www/html/custom_apps
      - ./config:/var/www/html/config
      - ./data:/var/www/html/data
      - ./themes:/var/www/html/themes
    networks: [nextcloud_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/status.php || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  # ---------- PostgreSQL for ONLYOFFICE ----------
  onlyoffice-db:
    image: postgres:14
    container_name: onlyoffice-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=onlyoffice
      - POSTGRES_USER=onlyoffice
      - POSTGRES_PASSWORD=${ONLYOFFICE_DB_PASSWORD}
    volumes:
      - ./onlyoffice-db:/var/lib/postgresql/data
    networks: [nextcloud_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onlyoffice -d onlyoffice -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------- ONLYOFFICE Document Server ----------
  onlyoffice:
    image: onlyoffice/documentserver:8.0.1   # pinned stable
    container_name: onlyoffice
    restart: unless-stopped
    depends_on:
      - onlyoffice-db
    ports:
      - "8087:80"   # change/remove if you use a reverse proxy
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET}
      - DB_TYPE=postgres
      - DB_HOST=onlyoffice-db
      - DB_PORT=5432
      - DB_NAME=onlyoffice
      - DB_USER=onlyoffice
      - DB_PWD=${ONLYOFFICE_DB_PASSWORD}
      - DS_LOG_LEVEL=DEBUG
    shm_size: "2g"   # critical for embedded editors/Chromium
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks: [nextcloud_net]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/healthcheck || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 30
