version: "3.9"

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    environment:
      - TZ=America/Chicago
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - PRIVATE_INTERNET_ACCESS_OPENVPN_ENCRYPTION_PRESET=normal
      - SERVER_REGIONS=CA Toronto
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_STATUS_FILE=/gluetun/forwarded_port
      - VPN_PORT_FORWARDING_UPDATER=transmission
      - VPN_PORT_FORWARDING_UPDATER_TRANSMISSION_HOST=127.0.0.1
      - VPN_PORT_FORWARDING_UPDATER_TRANSMISSION_PORT=9091
      - FIREWALL_INPUT_PORTS=9091
    volumes:
      - /home/juan/vpn/gluetun:/gluetun
    ports:
      - 9091:9091
      - 6789:6789      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO", "-", "https://ipinfo.io/ip"]
      interval: 30s
      timeout: 10s
      retries: 3
# --- NZBGet (behind VPN) ---
  nzbget:
    image: lscr.io/linuxserver/nzbget:latest
    container_name: nzbget
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /home/juan/nzbget/config:/config
      - /mnt/storage-pool/downloads:/downloads
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped
  # --- Transmission (behind VPN) ---
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    environment:
      - TRANSMISSION_PEER_PORT_RANDOM_ON_START=false
      - TRANSMISSION_WEB_UI=kettu
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Performance tuning
      - TRANSMISSION_RATIO_LIMIT_ENABLED=true
      - TRANSMISSION_RATIO_LIMIT=1.0
      - TRANSMISSION_PEER_LIMIT_GLOBAL=500
      - TRANSMISSION_PEER_LIMIT_PER_TORRENT=100
    volumes:
      - /home/juan/transmission/config:/config
      - /mnt/storage-pool/downloads:/downloads
      - /mnt/storage-pool/downloads/watch:/watch
    network_mode: "service:gluetun"   # Forces all traffic through VPN
    depends_on:
      gluetun:
        condition: service_healthy
    restart: unless-stopped

  # --- Sonarr (outside VPN) ---
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /home/juan/sonarr/config:/config
      - /mnt/storage-pool/downloads:/downloads
      - /mnt/storage-pool/media/tv:/tv
      - /mnt/storage-pool/recycleBin:/recyclebin
    ports:
      - 8989:8989
    restart: unless-stopped

  # --- Radarr (outside VPN) ---
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /home/juan/radarr/config:/config
      - /mnt/storage-pool/downloads:/downloads
      - /mnt/storage-pool/media/movies:/movies
      - /mnt/storage-pool/recycleBin:/recyclebin
    ports:
      - 7878:7878
    restart: unless-stopped

  # --- Prowlarr (outside VPN) ---
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - /home/juan/prowlarr/config:/config
    ports:
      - 9696:9696
    restart: unless-stopped

  # --- FlareSolverr (outside VPN) ---
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
    ports:
      - 8191:8191
    restart: unless-stopped
# --- Cleanuparr (auto-removes bad/malicious downloads, re-triggers search) ---
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - /home/juan/cleanuparr/config:/config
    environment:
      - PORT=11011
      - BASE_PATH=
      - PUID=1000
      - PGID=1000
      - UMASK=022
      - TZ=America/Chicago
